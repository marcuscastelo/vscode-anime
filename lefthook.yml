pre-commit:
  parallel: true
  commands:
    biome:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,css,md,yml,yaml}'
      run: pnpm exec biome check --write --no-errors-on-unmatched -- {staged_files}
      stage_fixed: true
    eslint:
      glob: '*.{js,jsx,ts,tsx,mjs,cjs}'
      run: pnpm exec eslint --max-warnings=0 -- {staged_files}

commit-msg:
  commands:
    conventional-commit:
      run: pnpm exec commitlint --edit {1}

pre-push:
  commands:
    check:
      run: pnpm run check
